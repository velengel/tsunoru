<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google認証と匿名回答の理解ゲート</title><style>:root{color-scheme:dark;--bg:#14201b;--card:#20332a;--ink:#f2f5ee;--muted:#b8c8bd;--accent:#a8d5a2;--bad:#f2b8a8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#14201b,#304838);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;color:var(--ink);line-height:1.7}main{max-width:780px;margin:auto;padding:28px 18px 56px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em}h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.2;margin:.4rem 0 1rem}h2{font-size:1.25rem;line-height:1.45}.intro,.card,.result{background:#20332aee;border:1px solid #91ae9855;border-radius:18px;padding:20px;box-shadow:0 18px 40px #0003}.intro{margin-bottom:18px}.meta{color:var(--muted);font-size:.95rem}.choice{display:flex;gap:12px;align-items:flex-start;padding:13px;border:1px solid #91ae9855;border-radius:12px;margin:10px 0;cursor:pointer}.choice:has(input:checked){border-color:var(--accent);background:#a8d5a21c}.choice input{margin-top:.35rem;accent-color:var(--accent)}button{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;background:var(--accent);color:#132117;cursor:pointer}button:focus-visible,.choice:has(input:focus-visible){outline:3px solid #fff;outline-offset:3px}.feedback{margin-top:18px;padding:14px;border-radius:12px;background:#132117}.feedback.bad{border-left:4px solid var(--bad)}.feedback.good{border-left:4px solid var(--accent)}[hidden]{display:none!important}@media(max-width:420px){main{padding:20px 12px 40px}.card,.intro,.result{padding:16px}.choice{gap:9px}}</style></head><body><main><p class="eyebrow">TSUNORU · IMPLEMENTATION GATE</p><h1>Google認証と匿名回答の理解ゲート</h1><section class="intro"><p>実装前に、今回の認証境界を2問だけ確認します。両方の理由を説明できれば実装へ進みます。</p><p class="meta">このゲートは学習用です。secretやGoogleアカウント情報は入力しません。</p></section><section id="quiz" class="card" aria-live="polite"></section><section id="done" class="result" hidden></section></main><script>var qs=[['主催者だけGoogleログインを必須にし、回答者を匿名のまま許可する主な理由は？',['全員のGoogleメールアドレスを保存したいから','共有URLから短く回答する体験を守り、主催者の管理だけ本人確認したいから','Google APIの料金を減らすため'],1,'認証は権限が必要な境界へ置き、回答者の最短導線は維持します。'],['GoogleのID Tokenを、そのままイベント削除の権限として使わないのはなぜ？',['ID Tokenは暗号化されているから','Googleのsubjectはイベント所有者を表すから','Googleの本人確認とTSUNORU内のセッション・権限・失効を分離する必要があるから'],2,'Googleの認証結果を検証した後、TSUNORU独自のHttpOnlyセッションを発行します。']];var i=0,score=0,answered=false,quiz=document.getElementById('quiz'),done=document.getElementById('done');function esc(s){return s.replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}function render(){answered=false;var q=qs[i],html='<p class="meta">第'+(i+1)+'問 / '+qs.length+'</p><h2>'+esc(q[0])+'</h2><fieldset>';q[1].forEach(function(x,n){html+='<label class="choice"><input type="radio" name="answer" value="'+n+'"><span>'+esc(x)+'</span></label>'});html+='</fieldset><button id="submit" type="button">回答する</button><div id="feedback" class="feedback" hidden></div>';quiz.innerHTML=html;document.getElementById('submit').onclick=grade}function grade(){if(answered)return;var q=qs[i],picked=quiz.querySelector('input:checked'),f=document.getElementById('feedback');if(!picked){f.hidden=false;f.className='feedback bad';f.textContent='回答を選んでください。';return}answered=true;var ok=Number(picked.value)===q[3];if(ok)score++;f.hidden=false;f.className='feedback '+(ok?'good':'bad');f.innerHTML='<strong>'+(ok?'正解':'不正解')+'</strong><p>'+esc(q[4])+'</p>';quiz.querySelectorAll('input').forEach(function(x){x.disabled=true});var b=document.getElementById('submit');b.textContent=i+1===qs.length?'結果を見る':'次の問題へ';b.onclick=function(){i++;i<qs.length?render():finish()}}function finish(){quiz.hidden=true;done.hidden=false;done.innerHTML='<h2>理解ゲート完了</h2><p><strong>'+score+' / '+qs.length+' 問正解</strong></p><p>'+(score===qs.length?'実装へ進めます。':'ADR 0060を確認してから再挑戦してください。')+'</p><button type="button" id="restart">もう一度挑戦する</button>';localStorage.setItem('tsunoru-google-auth-gate:v1',JSON.stringify({score:score,completedAt:new Date().toISOString()}));document.getElementById('restart').onclick=function(){i=0;score=0;quiz.hidden=false;done.hidden=true;render()}}render();</script></body></html>
