[package]
name = "tsunoru-rust-worker"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
worker = { version = "=0.8.5", features = ["d1", "http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "=2.6.1"
futures-util = "0.3"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
hmac = "=0.12.1"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
