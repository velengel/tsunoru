[package]
name = "tsunoru-rust-worker"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
worker = { version = "=0.8.5", features = ["d1", "http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
