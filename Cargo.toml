[package]
name = "tsunoru"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["fullstack", "lib", "launch", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = { version = "1", optional = true }
argon2 = { version = "=0.6.0", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"], optional = true }
chrono-tz = { version = "0.10.4", optional = true }
sha2 = { version = "0.10", optional = true }
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
dioxus-ssr = "=0.7.10"

[features]
default = ["web"]
web = ["dioxus/web"]
server = [
  "dioxus/server",
  "dep:anyhow",
  "dep:argon2",
  "dep:chrono",
  "dep:chrono-tz",
  "dep:sha2",
  "dep:sqlx",
  "dep:tokio",
  "dep:uuid",
]
